<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content" />
		<meta name="color-scheme" content="dark" />
		<title>Futuris Chat</title>
		<link rel="stylesheet" href="css/futuris.css?v=1f58c4f0" />
		<link rel="stylesheet" href="css/chat.css" />
	</head>
	<body id="chat-page">
		<iframe id="site-menu" title="Pages" src="navigation.html#chat"></iframe>
		<header class="chat-header">
			<h1>Chat</h1>
			<p id="chat-status" role="status">Loading configuration…</p>
			<button id="chat-new" type="button" disabled>New chat</button>
		</header>

		<main id="chat">
			<div class="chat-transcript">
				<div id="chat-scroll" role="region" aria-label="Conversation" tabindex="0">
					<div id="chat-empty">
						<div>
							<h2>Start a <span>conversation.</span></h2>
							<p>Ask a question or work with files in your VFS.</p>
							<a id="chat-setup" href="LLM.html" hidden>Choose a model in LLM Configuration</a>
						</div>
					</div>
					<div id="chat-log"></div>
				</div>
				<button id="chat-latest" type="button" hidden><span aria-hidden="true">↓</span> Latest</button>
			</div>

			<footer class="chat-footer">
				<form id="chat-form">
					<label class="chat-label" for="chat-input">Message</label>
					<textarea id="chat-input" name="message" rows="1" placeholder="Message Futuris…" disabled></textarea>
					<button id="chat-send" type="submit" disabled>Send <span aria-hidden="true">↑</span></button>
					<button id="chat-stop" type="button" hidden>Stop <span aria-hidden="true">■</span></button>
				</form>
				<p class="chat-shortcut">Enter to send · Shift + Enter for a new line</p>
				<p id="chat-storage" role="status" hidden></p>
			</footer>
		</main>

		<script src="js/llm.js"></script>
		<script src="js/vfs.js"></script>
		<script src="js/vendor/markdown-it-15.0.3.min.js"></script>
		<script src="js/chat.js"></script>
	</body>
</html>
