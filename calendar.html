<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>Futuris Calendar</title>
		<link rel="stylesheet" href="css/futuris.css?v=1f58c4f0" />
		<style>
			:root {
				--calendar-gap: clamp(4px, 1vw, 10px);
				--calendar-width: 43rem;
			}

			.calendar-header {
				display: grid;
				grid-template-columns: auto 1fr auto;
				align-items: center;
				gap: 10px;
				padding-bottom: 10px;
				border-bottom: 1px solid var(--color-line);
				max-width: var(--calendar-width);
				margin: 0 auto;
			}

			.calendar-section {
				width: min(100%, var(--calendar-width));
				margin-inline: auto;
			}

			.calendar-header button {
				background: var(--color-surface-raised);
				border: 1px solid var(--color-border);
				color: var(--color-foreground);
				border-radius: 10px;
				width: 42px;
				height: 42px;
				cursor: pointer;
				font-size: 1.1rem;
				display: inline-flex;
				align-items: center;
				justify-content: center;
				transition: border-color 0.15s ease;
			}

			.calendar-header button:hover {
				border-color: var(--color-primary);
			}

			.calendar-title {
				margin: 0;
				text-align: center;
				font-family: var(--font-display);
				font-size: 1.4rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--color-primary);
			}

			.calendar-weekdays,
			.calendar-grid {
				display: grid;
				grid-template-columns: repeat(7, minmax(0, 1fr));
				gap: var(--calendar-gap);
				width: 100%;
				margin: 0 auto;
			}

			.calendar-weekdays {
				padding-block: 10px 8px;
			}

			.calendar-weekdays span {
				text-align: center;
				font-size: 0.72rem;
				letter-spacing: 0.08em;
				text-transform: uppercase;
				color: var(--color-muted);
			}

			.calendar-day {
				background: var(--color-surface-raised);
				border: 1px solid var(--color-line);
				border-radius: 10px;
				display: flex;
				align-items: center;
				justify-content: center;
				aspect-ratio: 1 / 1;
				font-weight: 600;
				font-size: clamp(0.75rem, 1.6vw, 0.95rem);
				color: var(--color-foreground);
				padding: 0;
			}

			.calendar-day--empty {
				background: var(--color-surface-inset);
				border: 1px dashed var(--color-line);
				color: transparent;
				box-shadow: none;
			}

			.calendar-day--today {
				border-color: var(--color-primary);
				background: var(--color-accent-soft);
				color: var(--color-primary);
			}

			.time-popup::backdrop {
				background: rgb(0 0 0 / 72%);
			}

			.time-popup {
				background: var(--color-background-box);
				border: 1px solid var(--color-border);
				border-radius: var(--radius);
				padding: 14px 16px;
				width: min(calc(100% - 40px), 51.25rem);
				max-height: calc(100dvh - 40px);
				overflow: auto;
				box-shadow: 0 24px 50px rgba(0, 0, 0, 0.55);
			}

			.time-popup h3 {
				margin: 0 0 12px;
				font-family: var(--font-display);
				letter-spacing: 0.08em;
				text-transform: uppercase;
				font-size: 1rem;
				color: var(--color-primary);
			}

			.time-grid {
				display: grid;
				grid-template-columns: 1fr;
				gap: 12px;
			}

			.time-group {
				display: grid;
				grid-template-columns: repeat(3, minmax(0, 1fr));
				gap: 8px;
			}

			.time-block {
				padding-bottom: 10px;
			}

			.time-block:last-of-type {
				padding-bottom: 0;
			}

			.time-card {
				aspect-ratio: 2 / 1;
				border-radius: 12px;
				border: 1px solid var(--color-border);
				background: var(--color-surface-raised);
				display: flex;
				flex-direction: column;
				justify-content: flex-start;
				gap: 4px;
				padding: 6px 8px 8px;
			}

			.time-card span {
				font-size: 0.7rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--color-muted);
				font-family: var(--font-display);
				line-height: 1;
			}

			.time-card textarea {
				background: transparent;
				border: none;
				color: var(--color-foreground);
				font-family: var(--font-mono);
				font-size: 0.8rem;
				padding: 4px 0 0;
				resize: none;
				min-height: 0;
				flex: 1;
				width: 100%;
			}

			.time-card textarea:focus {
				outline: 1px solid var(--color-primary);
			}

			.time-label {
				display: inline-block;
				margin-bottom: 6px;
				font-size: 0.75rem;
				letter-spacing: 0.12em;
				text-transform: uppercase;
				color: var(--color-muted);
			}

			.time-actions {
				display: flex;
				justify-content: flex-end;
			}

			@media (max-width: 720px) {
				.calendar-title {
					font-size: 1rem;
					letter-spacing: 0.04em;
				}

				.time-popup {
					padding: 14px;
				}

				.time-group {
					grid-template-columns: repeat(2, minmax(0, 1fr));
				}
			}
		</style>
	</head>
	<body>
		<iframe id="site-menu" title="Pages" src="navigation.html#calendar"></iframe>
		<header>
			<h1>Calendar</h1>
			<p>Browse the calendar one month at a time.</p>
		</header>

		<div id="layout">
			<main>
				<section class="calendar-section" aria-labelledby="calendar-title">
					<div class="calendar-header">
						<button id="calendar-prev" type="button" aria-label="Previous month">
							&larr;
						</button>
						<h2 id="calendar-title" class="calendar-title" aria-live="polite"></h2>
						<button id="calendar-next" type="button" aria-label="Next month">
							&rarr;
						</button>
					</div>
					<div class="calendar-weekdays" aria-hidden="true">
						<span>Mon</span>
						<span>Tue</span>
						<span>Wed</span>
						<span>Thu</span>
						<span>Fri</span>
						<span>Sat</span>
						<span>Sun</span>
					</div>
					<div id="calendar-grid" class="calendar-grid"></div>
					<p id="calendar-status" role="status" hidden></p>
				</section>
			</main>
		</div>

		<dialog id="time-overlay" class="time-popup" aria-labelledby="time-popup-title">
			<h3 id="time-popup-title">Time slots</h3>
			<div class="time-grid">
				<div class="time-block">
					<span class="time-label">Morning</span>
					<div class="time-group">
						<label class="time-card"><span>07:00</span><textarea data-hour="07:00"></textarea></label>
						<label class="time-card"><span>08:00</span><textarea data-hour="08:00"></textarea></label>
						<label class="time-card"><span>09:00</span><textarea data-hour="09:00"></textarea></label>
						<label class="time-card"><span>10:00</span><textarea data-hour="10:00"></textarea></label>
						<label class="time-card"><span>11:00</span><textarea data-hour="11:00"></textarea></label>
						<label class="time-card"><span>12:00</span><textarea data-hour="12:00"></textarea></label>
					</div>
				</div>
				<div class="time-block">
					<span class="time-label">Afternoon</span>
					<div class="time-group">
						<label class="time-card"><span>13:00</span><textarea data-hour="13:00"></textarea></label>
						<label class="time-card"><span>14:00</span><textarea data-hour="14:00"></textarea></label>
						<label class="time-card"><span>15:00</span><textarea data-hour="15:00"></textarea></label>
						<label class="time-card"><span>16:00</span><textarea data-hour="16:00"></textarea></label>
						<label class="time-card"><span>17:00</span><textarea data-hour="17:00"></textarea></label>
						<label class="time-card"><span>18:00</span><textarea data-hour="18:00"></textarea></label>
					</div>
				</div>
				<div class="time-block">
					<span class="time-label">Evening</span>
					<div class="time-group">
						<label class="time-card"><span>19:00</span><textarea data-hour="19:00"></textarea></label>
						<label class="time-card"><span>20:00</span><textarea data-hour="20:00"></textarea></label>
						<label class="time-card"><span>21:00</span><textarea data-hour="21:00"></textarea></label>
						<label class="time-card"><span>22:00</span><textarea data-hour="22:00"></textarea></label>
						<label class="time-card"><span>23:00</span><textarea data-hour="23:00"></textarea></label>
						<label class="time-card"><span>24:00</span><textarea data-hour="24:00"></textarea></label>
					</div>
				</div>
			</div>
			<div class="time-actions">
				<button id="time-close" type="button">Close</button>
			</div>
		</dialog>

		<script src="js/vfs.js"></script>
		<script>
			(async () => {
				const calendarTitle = document.getElementById("calendar-title");
				const calendarGrid = document.getElementById("calendar-grid");
				const prevButton = document.getElementById("calendar-prev");
				const nextButton = document.getElementById("calendar-next");
				const timeOverlay = document.getElementById("time-overlay");
				const timeClose = document.getElementById("time-close");
				const timeTitle = document.getElementById("time-popup-title");
				const timeInputs = Array.from(document.querySelectorAll(".time-card textarea"));

				const monthFormat = new Intl.DateTimeFormat("en-GB", { month: "long", year: "numeric" });
				const dayFormat = new Intl.DateTimeFormat("en-GB", { day: "numeric", month: "long", year: "numeric" });

				const pad2 = (value) => String(value).padStart(2, "0");
				const today = new Date();
				const viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
				let currentDateKey = null;
				const calendarMap = new Map();
				const status = document.getElementById("calendar-status");
				let vfs;
				let savedText;
				let saveTimer;
				let pendingSave = Promise.resolve();

				const saveNotes = () => {
					clearTimeout(saveTimer);
					saveTimer = undefined;
					pendingSave = pendingSave.then(async () => {
						const ordered = [...calendarMap].sort(([first], [second]) => first.localeCompare(second));
						const text = JSON.stringify(ordered.map(([key, value]) => ({ [key]: value })), null, 2);
						if (text === savedText) return;
						await vfs.put("/calendar.json", text, { expectedValue: savedText });
						savedText = text;
						status.hidden = true;
					}).catch((error) => {
						status.textContent = "Could not save calendar notes: " + (error?.message || error);
						status.hidden = false;
					});
				};

				const openTimePopup = (year, month, dayNumber) => {
					currentDateKey = `${year}${pad2(month + 1)}${pad2(dayNumber)}`;
					timeTitle.textContent = dayFormat.format(new Date(year, month, dayNumber));
					timeInputs.forEach((input) => {
						const hour = input.dataset.hour?.slice(0, 2) || "00";
						const key = `${currentDateKey}-${hour}`;
						input.value = calendarMap.get(key) || "";
					});
					timeOverlay.showModal();
				};

				const renderCalendar = () => {
					const year = viewDate.getFullYear();
					const month = viewDate.getMonth();
					calendarTitle.textContent = monthFormat.format(viewDate);
					calendarGrid.replaceChildren();

					const firstDay = new Date(year, month, 1);
					const startOffset = (firstDay.getDay() + 6) % 7;
					const daysInMonth = new Date(year, month + 1, 0).getDate();
					const totalCells = 42;

					for (let i = 0; i < totalCells; i += 1) {
						const dayNumber = i - startOffset + 1;
						const inMonth = dayNumber >= 1 && dayNumber <= daysInMonth;
						const cell = document.createElement(inMonth ? "button" : "span");
						cell.classList.add("calendar-day");

						if (!inMonth) {
							cell.classList.add("calendar-day--empty");
							cell.setAttribute("aria-hidden", "true");
						} else {
							cell.textContent = dayNumber;
							cell.type = "button";
							cell.setAttribute("aria-label", dayFormat.format(new Date(year, month, dayNumber)));
							const isToday =
								dayNumber === today.getDate() &&
								month === today.getMonth() &&
								year === today.getFullYear();
							if (isToday) {
								cell.classList.add("calendar-day--today");
							}
							cell.addEventListener("click", () => {
								openTimePopup(year, month, dayNumber);
							});
						}

						calendarGrid.appendChild(cell);
					}
				};

				timeInputs.forEach((input) => {
					input.addEventListener("input", () => {
						if (!currentDateKey) return;
						const hour = input.dataset.hour?.slice(0, 2) || "00";
						const key = `${currentDateKey}-${hour}`;
						const value = input.value;
						if (value.trim() === "") {
							calendarMap.delete(key);
						} else {
							calendarMap.set(key, value);
						}
						clearTimeout(saveTimer);
						saveTimer = setTimeout(saveNotes, 300);
					});
				});

				timeOverlay.addEventListener("close", () => {
					if (saveTimer !== undefined) saveNotes();
				});
				document.addEventListener("visibilitychange", () => {
					if (document.hidden && saveTimer !== undefined) saveNotes();
				});
				timeClose.addEventListener("click", () => timeOverlay.close());
				timeOverlay.addEventListener("click", (event) => {
					if (event.target !== timeOverlay) return;
					const { left, right, top, bottom } = timeOverlay.getBoundingClientRect();
					if (event.clientX < left || event.clientX > right || event.clientY < top || event.clientY > bottom) {
						timeOverlay.close();
					}
				});

				try {
					vfs = await window.vfsReady;
					try {
						savedText = await vfs.getasync("/calendar.json");
					} catch (error) {
						if (error !== "Key not found") throw error;
						try {
							await vfs.fileSystem.write("/calendar.json", "[]", { exclusive: true });
						} catch (createError) {
							if (createError.code !== "EEXIST") throw createError;
						}
						savedText = await vfs.getasync("/calendar.json");
					}
					const entries = JSON.parse(savedText);
					if (!Array.isArray(entries)) throw new Error("Expected a list of notes.");
					for (const entry of entries) {
						if (!entry || typeof entry !== "object") continue;
						const [note] = Object.entries(entry);
						if (note) calendarMap.set(note[0], String(note[1] ?? ""));
					}
				} catch (error) {
					status.textContent = "Could not load calendar notes: " + (error?.message || error);
					status.hidden = false;
					for (const input of timeInputs) input.readOnly = true;
				}
				prevButton.addEventListener("click", () => {
					viewDate.setMonth(viewDate.getMonth() - 1);
					renderCalendar();
				});

				nextButton.addEventListener("click", () => {
					viewDate.setMonth(viewDate.getMonth() + 1);
					renderCalendar();
				});

				renderCalendar();
			})();
		</script>
	</body>
</html>
