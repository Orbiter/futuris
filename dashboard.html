<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="dark" />
		<title>Futuris Dashboard</title>
		<link rel="stylesheet" href="css/futuris.css?v=1f58c4f0" />
		<link rel="stylesheet" href="css/dashboard.css" />
	</head>
	<body>
		<iframe id="site-menu" title="Pages" src="navigation.html#dashboard"></iframe>
		<header>
			<h1>Forecast Dashboard</h1>
			<p>Track observed signups and the 14-day forecast.</p>
		</header>

		<div id="layout">
			<main id="forecast-dashboard">
				<section aria-labelledby="time-series-forecast">
					<h2 id="time-series-forecast">
						Time-Series Forecast
					</h2>
					<form id="forecast-controls" aria-label="Forecast controls">
						<div class="forecast-filters">
							<div>
								<label for="range">Date range</label>
								<select id="range" name="range">
									<option>Last 7 days</option>
									<option selected>Last 30 days</option>
									<option>Last 90 days</option>
								</select>
							</div>

							<div>
								<label for="series">Series</label>
								<select id="series" name="series">
									<option selected>Daily signups</option>
									<option>Revenue</option>
									<option>Churn rate</option>
								</select>
							</div>

							<div>
								<label for="horizon">Forecast horizon</label>
								<select id="horizon" name="horizon">
									<option>7 days</option>
									<option selected>14 days</option>
									<option>30 days</option>
								</select>
							</div>

							<div><button type="button">Apply</button></div>
						</div>
					</form>
					<figure>
						<div id="forecast-chart" aria-label="Time-series forecast chart"></div>
						<figcaption>
							Observed values with a 14-day prediction and confidence band.
						</figcaption>
					</figure>
				</section>

				<section aria-labelledby="forecast-table">
					<h2 id="forecast-table">Forecast Table</h2>
					<table>
						<thead>
							<tr>
								<th>Date</th>
								<th>Prediction</th>
								<th>Lower</th>
								<th>Upper</th>
							</tr>
						</thead>
						<tbody>
							<tr>
								<td>2024-07-19</td>
								<td>5,020</td>
								<td>4,780</td>
								<td>5,260</td>
							</tr>
							<tr>
								<td>2024-07-20</td>
								<td>5,080</td>
								<td>4,840</td>
								<td>5,320</td>
							</tr>
							<tr>
								<td>2024-07-21</td>
								<td>5,120</td>
								<td>4,880</td>
								<td>5,360</td>
							</tr>
							<tr>
								<td>2024-07-22</td>
								<td>5,180</td>
								<td>4,940</td>
								<td>5,420</td>
							</tr>
							<tr>
								<td>2024-07-23</td>
								<td>5,240</td>
								<td>5,000</td>
								<td>5,480</td>
							</tr>
						</tbody>
					</table>
				</section>
			</main>
		</div>

		<script src="https://cdn.plot.ly/plotly-2.30.0.min.js"></script>
		<script>
			(() => {
			const theme = getComputedStyle(document.documentElement);
			const color = (name) => theme.getPropertyValue(`--color-${name}`).trim();
			const observedDates = [
				"2024-06-20",
				"2024-06-22",
				"2024-06-24",
				"2024-06-26",
				"2024-06-28",
				"2024-06-30",
				"2024-07-02",
				"2024-07-04",
				"2024-07-06",
				"2024-07-08",
				"2024-07-10",
				"2024-07-12",
				"2024-07-14",
				"2024-07-16",
				"2024-07-18"
			];
			const observedValues = [
				4200,
				4320,
				4480,
				4390,
				4510,
				4630,
				4720,
				4680,
				4800,
				4920,
				4890,
				5010,
				5100,
				5050,
				5180
			];
			const forecastDates = [
				"2024-07-18",
				"2024-07-20",
				"2024-07-22",
				"2024-07-24",
				"2024-07-26",
				"2024-07-28",
				"2024-07-30",
				"2024-08-01"
			];
			const forecastValues = [5180, 5250, 5310, 5360, 5420, 5490, 5550, 5620];
			const lowerBand = [5010, 5080, 5140, 5190, 5240, 5310, 5370, 5440];
			const upperBand = [5350, 5420, 5480, 5530, 5600, 5670, 5730, 5800];

			const observedTrace = {
				x: observedDates,
				y: observedValues,
				mode: "lines+markers",
				name: "Observed",
				line: { width: 3, color: color("signal") }
			};
			const forecastTrace = {
				x: forecastDates,
				y: forecastValues,
				mode: "lines+markers",
				name: "Forecast",
				line: { width: 3, dash: "dot", color: color("primary") }
			};
			const bandLower = {
				x: forecastDates,
				y: lowerBand,
				mode: "lines",
				line: { width: 0 },
				showlegend: false,
				hoverinfo: "skip"
			};
			const bandUpper = {
				x: forecastDates,
				y: upperBand,
				mode: "lines",
				fill: "tonexty",
				fillcolor: color("glow"),
				line: { width: 0 },
				name: "Confidence",
				hoverinfo: "skip"
			};

			const layout = {
				paper_bgcolor: color("surface-inset"),
				plot_bgcolor: color("surface-inset"),
				font: { color: color("muted"), family: theme.getPropertyValue("--font-mono").trim(), size: 11 },
				margin: { t: 12, r: 12, b: 44, l: 48 },
				xaxis: { title: "Date", gridcolor: color("line"), automargin: true, nticks: 5 },
				yaxis: { title: "Daily signups", gridcolor: color("line"), automargin: true },
				legend: { orientation: "h", yanchor: "bottom", y: 1.04, x: 0 }
			};

			Plotly.newPlot(
				"forecast-chart",
				[bandLower, bandUpper, observedTrace, forecastTrace],
				layout,
				{ displayModeBar: false, responsive: true }
			);
			})();
		</script>
	</body>
</html>
